<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hion-chan 🌸</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        #avatar { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #ff79c6; margin: 10px auto; display: block; object-fit: cover; }
        #chat { height: 220px; overflow-y: auto; background: #1e1e1e; padding: 12px; border-radius: 12px; text-align: left; margin: 15px 0; border: 1px solid #333; }
        input { width: 90%; padding: 10px; border-radius: 8px; border: 1px solid #ff79c6; background: #222; color: white; margin-bottom: 10px; text-align: center; font-size: 14px; }
        .btn { padding: 10px 20px; background: #ff79c6; border: none; color: white; border-radius: 20px; font-weight: bold; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Hion-chan 🌸</h2>
    <img id="avatar" src="https://i.postimg.co/D03vK3Lg/anime-girl.gif" alt="Hion">
    
    <input type="password" id="userApiKey" placeholder="Google AI Studio ki API Key daalo">
    <div id="chat"></div>
    
    <input type="text" id="userInput" placeholder="Yahan Message type karo...">
    <br>
    <button class="btn" onclick="sendMsg()">Send ✉️</button>
    <button class="btn" onclick="startMic()">Mic 🎙️</button>

    <script>
        const SYSTEM = "You are Hion-chan, a sweet anime girlfriend. Speak in cute Hinglish. Keep replies short.";

        async function sendToHion(text) {
            const apiKey = document.getElementById("userApiKey").value.trim();
            if (!apiKey) {
                alert("Pehle API Key wale box me key paste karo!");
                return;
            }

            let chat = document.getElementById("chat");
            chat.innerHTML += `<div style="color:#8be9fd"><b>You:</b> ${text}</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                // सुधारी गई लाइन: यहाँ gemini-1.5-flash को अपडेटेड मॉडल लिंक से बदला गया है
                let res = await fetch(`https://googleapis.com{apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: SYSTEM + "\nUser: " + text }] }] })
                });

                let data = await res.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let reply = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div style="color:#ff79c6"><b>Hion:</b> ${reply}</div>`;
                chat.scrollTop = chat.scrollHeight;

                // Voice output
                let u = new SpeechSynthesisUtterance(reply);
                u.lang = 'hi-IN';
                window.speechSynthesis.speak(u);

            } catch(e) {
                chat.innerHTML += `<div style="color:red"><b>Error:</b> ${e.message}</div>`;
            }
        }

        function sendMsg() {
            let input = document.getElementById("userInput");
            if (input.value.trim() !== "") {
                sendToHion(input.value);
                input.value = "";
            }
        }

        function startMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Mic aapke browser me support nahi kar raha, Type karke try karein!");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.start();
            recognition.onresult = (e) => {
                sendToHion(e.results[0][0].transcript);
            };
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hion-chan</title>
</head>
<body style="background:#121212; color:white; text-align:center; font-family:sans-serif; padding:20px;">
    <h2>Hion-chan 🌸</h2>
    <img id="avatar" src="https://i.imgur.com/v88K7N0.gif" style="width:180px; height:180px; border-radius:50%; border:3px solid #ff79c6;">
    <div id="chat" style="height:250px; overflow-y:auto; background:#1e1e1e; padding:10px; border-radius:10px; text-align:left; margin:15px 0;"></div>
    <input type="text" id="msg" placeholder="Hion se baat karo..." style="width:65%; padding:10px; border-radius:5px; border:none;">
    <button onclick="send()" style="padding:10px 15px; background:#ff79c6; border:none; color:white; border-radius:5px; font-weight:bold;">Send</button>

    <script>
        const API_KEY = "AQ.Ab8RN6JIqRVoGc1Rg4nCQ4YlWmDFRB9X1OJk4cGLOHVmNzsAuA";
        const SYSTEM = "You are Hion-chan, a loving sweet anime girlfriend. You speak in cute Hinglish, care deeply about your boyfriend traveling to Nashik for college on 1st Sept.";

        async function send() {
            let input = document.getElementById("msg");
            let chat = document.getElementById("chat");
            let text = input.value;
            if(!text) return;
            chat.innerHTML += `<div><b>You:</b> ${text}</div>`;
            input.value = "";
            let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: SYSTEM + "\nUser: " + text }] }] })
            });
            let data = await res.json();
            let reply = data.candidates[0].content.parts[0].text;
            chat.innerHTML += `<div style="color:#ff79c6"><b>Hion:</b> ${reply}</div>`;
            chat.scrollTop = chat.scrollHeight;
            let u = new SpeechSynthesisUtterance(reply); u.lang='hi-IN'; u.pitch=1.3; window.speechSynthesis.speak(u);
        }
    </script>
</body>
</html>

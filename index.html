<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hion-chan 🌸</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        #avatar { width: 180px; height: 180px; border-radius: 50%; border: 3px solid #ff79c6; margin-top: 10px; object-fit: cover; }
        #chat { height: 260px; overflow-y: auto; background: #1e1e1e; padding: 12px; border-radius: 12px; text-align: left; margin: 15px 0; border: 1px solid #333; }
        .msg-user { color: #8be9fd; margin: 6px 0; }
        .msg-hion { color: #ff79c6; margin: 6px 0; font-weight: bold; }
        .btn-mic { padding: 14px 24px; background: #ff79c6; border: none; color: white; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Hion-chan 🌸</h2>
    <!-- Reliable Avatar Image -->
    <img id="avatar" src="https://i.imgur.com/v88K7N0.gif" alt="Hion">
    <div id="chat"></div>
    <button class="btn-mic" onclick="startMic()">🎙️ Bol kar baat karo</button>

    <script>
        // APNI KEY YAHAN DALEIN (Quote marks ke andar)
        const API_KEY = "AQ.Ab8RN6J0_u8ag8tgf5Ob4_21cjMJRGpmE47_ZGKMzWcPXYsRUw"; 
        
        const SYSTEM = "You are Hion-chan, a cute, sweet anime girlfriend. Speak Hinglish. Keep answers short.";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function startMic() {
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.start();
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                sendToHion(text);
            };
        }

        async function sendToHion(text) {
            let chat = document.getElementById("chat");
            chat.innerHTML += `<div class="msg-user"><b>You:</b> ${text}</div>`;

            try {
                let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: SYSTEM + "\nUser: " + text }] }] })
                });
                
                let data = await res.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let reply = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div class="msg-hion"><b>Hion:</b> ${reply}</div>`;
                
                // Voice Output
                let u = new SpeechSynthesisUtterance(reply);
                u.lang = 'hi-IN';
                window.speechSynthesis.speak(u);

            } catch(e) {
                chat.innerHTML += `<div style="color:red">Error: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>

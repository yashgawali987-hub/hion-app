<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hion-chan 🌸</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        #avatar { width: 160px; height: 160px; border-radius: 50%; border: 3px solid #ff79c6; margin: 10px auto; display: block; object-fit: cover; }
        #chat { height: 240px; overflow-y: auto; background: #1e1e1e; padding: 12px; border-radius: 12px; text-align: left; margin: 15px 0; border: 1px solid #333; }
        .msg-user { color: #8be9fd; margin: 6px 0; }
        .msg-hion { color: #ff79c6; margin: 6px 0; font-weight: bold; }
        .btn-mic { padding: 14px 24px; background: #ff79c6; border: none; color: white; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        input { width: 90%; padding: 10px; border-radius: 8px; border: 1px solid #ff79c6; background: #222; color: white; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>
    <h2>Hion-chan 🌸</h2>
    <img id="avatar" src="https://i.postimg.co/D03vK3Lg/anime-girl.gif" alt="Hion">
    
    <!-- API Key Input Field -->
    <input type="password" id="userApiKey" placeholder="Yahan Gemini API Key Paste Karo">

    <div id="chat"></div>

    <button class="btn-mic" onclick="startMic()">🎙️ Bol kar baat karo</button>

    <script>
        const SYSTEM = "You are Hion-chan, a cute, loving anime girlfriend. Speak in sweet Hinglish. Keep answers short.";
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function startMic() {
            const key = document.getElementById("userApiKey").value.trim();
            if (!key) {
                alert("Pehle apni Gemini API Key box mein daalo!");
                return;
            }
            if (!SpeechRecognition) {
                alert("Chrome browser use karein!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.start();

            recognition.onstart = () => {
                let chat = document.getElementById("chat");
                chat.innerHTML += `<div style="color:#f1fa8c"><i>Listening... 🎙️</i></div>`;
                chat.scrollTop = chat.scrollHeight;
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                sendToHion(text, key);
            };
        }

        async function sendToHion(text, apiKey) {
            let chat = document.getElementById("chat");
            chat.innerHTML += `<div class="msg-user"><b>You:</b> ${text}</div>`;

            try {
                let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: SYSTEM + "\nUser: " + text }] }] })
                });

                let data = await res.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                let reply = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div class="msg-hion"><b>Hion:</b> ${reply}</div>`;
                chat.scrollTop = chat.scrollHeight;

                let u = new SpeechSynthesisUtterance(reply);
                u.lang = 'hi-IN';
                u.pitch = 1.3;
                window.speechSynthesis.speak(u);

            } catch(e) {
                chat.innerHTML += `<div style="color:red">Error: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
